<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Grid Table</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div class="container mt-4">
    <h2 class="mb-3">Table using Bootstrap Grid System</h2>

    <div class="row bg-primary text-white fw-bold py-2 border">
      <div class="col-2">ID</div>
      <div class="col-4">Name</div>
      <div class="col-3">Course</div>
      <div class="col-3">City</div>
    </div>

    <div class="row py-2 border-bottom border-start border-end">
      <div class="col-2">.1</div>
      <div class="col-4">TIRTH BHIMANI</div>
      <div class="col-3">BCA</div>
      <div class="col-3">RAJKOT</div>
    </div>

    <div class="row py-2 border-bottom border-start border-end bg-light">
      <div class="col-2">.2</div>
      <div class="col-4">JADEJA DIGVIJAY SINH</div>
      <div class="col-3">BCA</div>
      <div class="col-3">RAJKOT</div>
    </div>

    <div class="row py-2 border-bottom border-start border-end">
      <div class="col-2">.3</div>
      <div class="col-4">RANA PRINCERAJSINH</div>
      <div class="col-3">BCA</div>
      <div class="col-3">SURENDRANAGAR</div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
