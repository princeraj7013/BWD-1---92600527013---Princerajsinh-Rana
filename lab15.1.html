<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Opacity Effect</title>
    <style>
        
        .hover-image {
            width: 300px;
            opacity: 1; 
            transition: opacity 0.3s ease;
            color: brown;
        }

        .hover-image:hover {
            opacity: 0.4;
        }
    </style>
</head>
<body>

    <h2>Image Opacity on Mouseover</h2>
    <img src="img .1.jpg" alt="Sample Image" class="hover-image">
    <img src="imge1.1.jpg" alt="simple Image" class="hover-image" >
    <img src="img .1.jpg" alt="simple Image" class="hover-image" >
    <img src="product12..avif" alt="simple Image" class="hover-image" >

</body>
</html>
